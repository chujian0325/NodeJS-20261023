<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      td {
        padding: 20px, 40px;
      }
      tr:nth-child(odd) {
        background: rgb(23, 225, 54);
      }
      tr:nth-child(even) {
        background: pink;
      }
    </style>
  </head>
  <body>
    <table border="1">
      <tr>
        <td>test</td>
        <td>test</td>
        <td>test</td>
      </tr>
      <tr>
        <td>test</td>
        <td>test</td>
        <td>test</td>
      </tr>
      <tr>
        <td>test</td>
        <td>test</td>
        <td>test</td>
      </tr>
      <tr>
        <td>test</td>
        <td>test</td>
        <td>test</td>
      </tr>
    </table>
    <script>
      // 获取所有的td
      let tds = document.querySelectorAll("td");
      // 遍历所有的td
      tds.forEach((td) => {
        // 给每一个td绑定点击事件
        td.onclick = function () {
          this.style.background = "orange";
        };
      });
    </script>
  </body>
</html>
